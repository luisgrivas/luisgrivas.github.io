{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Params.description }}
    <p>{{ . }}</p>
  {{ end }}
</header>

{{ with .Content }}
  <div class="notes-intro">
    {{ . }}
  </div>
{{ end }}

<ul class="notes-list">
{{ range .Pages.ByDate.Reverse }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Params.status }}
      <span class="note-status">({{ . }})</span>
    {{ end }}
  </li>
{{ end }}
</ul>
{{ end }}
